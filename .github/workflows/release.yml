name: Release

# Push a tag like v0.1.0. The job tests, builds the one bundled file, and publishes it with its
# SHA-256 as assets of a GitHub release. Roost's catalog row pins the tag and the SHA-256.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Check that the tag matches package.json
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match package.json ${version}."; exit 1; }
      - run: bun run build
      - name: Write the SHA-256
        working-directory: dist
        run: sha256sum roost-mcp-polymarket-us.js > roost-mcp-polymarket-us.js.sha256 && cat roost-mcp-polymarket-us.js.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/roost-mcp-polymarket-us.js \
            dist/roost-mcp-polymarket-us.js.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --notes "Put this in Roost's catalog row: tag ${GITHUB_REF_NAME}, sha256 $(cut -d' ' -f1 dist/roost-mcp-polymarket-us.js.sha256)."
